<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d2a24;--mut:#6b756f;--line:#d9d3c4;--acc:#1f5c46;--accx:#fff;--warn:#b4561b;--sel:#e4efe8}

header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

main{flex:1;display:flex;min-height:0}

#form{flex:1;overflow:auto;padding:18px 22px}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 16px;padding:12px 16px 16px}
legend{font:700 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);padding:0 6px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.age input{border:2px solid var(--acc);font-weight:700}.age em{font-size:11px;color:var(--warn);font-style:normal}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar .s{flex:1;color:var(--mut)}
@media(max-width:760px){main{flex-direction:column}aside{width:100%;height:38vh;border-right:0;border-bottom:1px solid var(--line)}}
